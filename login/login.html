<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Emag - Log In</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="logo">🛒</div>
        <h1>Welcome back</h1>
        <p class="auth-subtitle" id="authSubtitle">Log in to your account.</p>

        <!-- novalidate: the browser must not block the form, so OUR checks and the BACKEND's messages are what the user (and the tests) see -->
        <form id="loginForm" novalidate>
            <div class="form-error" id="formError" data-testid="login-error"></div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" data-testid="login-email" autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" data-testid="login-password" autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="form-submit" data-testid="login-submit">Log In</button>
        </form>

        <p class="auth-switch">New here? <a href="../signup/signup.html" id="signupLink" data-testid="signup-link">Create an account</a></p>
        <p class="auth-switch"><a href="../index_login/home_page.html">Continue browsing as a guest</a></p>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/cart-service.js"></script>
    <script src="login.js"></script>
</body>
</html>
