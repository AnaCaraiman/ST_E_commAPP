<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Emag - Sign Up</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="logo">🛒</div>
        <h1>Create your account</h1>
        <p class="auth-subtitle">It takes a few seconds.</p>

        <form id="signupForm" novalidate>
            <div class="form-error" id="formError" data-testid="signup-error"></div>

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-input" data-testid="signup-username" autocomplete="username">
                <span class="form-hint">At least 3 characters.</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" data-testid="signup-email" autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" data-testid="signup-password" autocomplete="new-password">
                <span class="form-hint">At least 6 characters, with a lowercase letter, an uppercase letter and a digit.</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" class="form-input" data-testid="signup-confirm-password" autocomplete="new-password">
            </div>

            <button type="submit" id="signupBtn" class="form-submit" data-testid="signup-submit">Sign Up</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="../login/login.html" id="loginLink" data-testid="login-link">Log in</a></p>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <div class="popup-message" id="popupMessage" data-testid="popup-message"></div>
        <button class="popup-close" id="popupClose">OK</button>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/validation.js"></script>
    <script src="signup.js"></script>
</body>
</html>
