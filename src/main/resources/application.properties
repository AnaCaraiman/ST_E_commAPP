spring.application.name=ecommerce

# MongoDB - a local MongoDB server (e.g. MongoDB Community Server for Windows).
# Override with env vars MONGODB_HOST / MONGODB_PORT / MONGODB_DATABASE.
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:test}

# Front-end origins allowed to call the API (comma separated). Override with env var CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
