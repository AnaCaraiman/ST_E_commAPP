<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Emag - My Cart</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav id="mainNav"></nav>

    <div class="container">
        <h1>My Cart</h1>

        <!-- Items + summary are created by cart.js -->
        <div id="cartContent" data-testid="cart-content">
            <div class="state-message">Loading your cart...</div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <div class="popup-message" id="popupMessage" data-testid="popup-message"></div>
        <button class="popup-close" id="popupClose">OK</button>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/images.js"></script>
    <script src="../js/cart-service.js"></script>
    <script src="../js/nav.js"></script>
    <script src="cart.js"></script>
</body>
</html>
