<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Emag - Payment</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav id="mainNav"></nav>

    <div class="container">
        <h1>Payment</h1>

        <!-- 1) The payment form + summary (shown when an order is waiting for payment) -->
        <div class="payment-layout" id="paymentLayout" style="display: none;">
            <div class="profile-card">
                <div class="demo-note" data-testid="demo-note">
                    This is a demo checkout. Do not enter a real card number: nothing is charged, sent or stored.
                </div>

                <form id="paymentForm" novalidate>
                    <div class="form-error" id="formError" data-testid="payment-error"></div>

                    <div class="form-group">
                        <label class="form-label" for="cardName">Name on card</label>
                        <input type="text" id="cardName" class="form-input" data-testid="card-name" autocomplete="cc-name">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cardNumber">Card number</label>
                        <!-- maxlength 19 = 16 digits + 3 spaces; validation.js removes everything that is not a digit while typing -->
                        <input type="text" id="cardNumber" class="form-input" data-testid="card-number"
                               inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" autocomplete="cc-number">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="cardExpiry">Expiry (MM/YY)</label>
                            <input type="text" id="cardExpiry" class="form-input" data-testid="card-expiry"
                                   inputmode="numeric" maxlength="5" placeholder="MM/YY" autocomplete="cc-exp">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="cardCvv">CVV</label>
                            <input type="password" id="cardCvv" class="form-input" data-testid="card-cvv"
                                   inputmode="numeric" maxlength="3" placeholder="123" autocomplete="cc-csc">
                        </div>
                    </div>

                    <button type="submit" id="payBtn" class="form-submit" data-testid="pay">Confirm Payment</button>
                </form>
            </div>

            <div class="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-row"><span>Order</span><span class="order-id" id="summaryOrderId" data-testid="summary-order-id"></span></div>
                <div class="summary-row"><span>Items</span><span id="summaryItems" data-testid="summary-items"></span></div>
                <div class="summary-row total"><span>To pay</span><span id="summaryTotal" data-testid="summary-total"></span></div>
            </div>
        </div>

        <!-- 2) Shown after "Confirm Payment" -->
        <div class="confirmation" id="confirmation" style="display: none;" data-testid="order-confirmed">
            <div class="confirmation-icon">✓</div>
            <h2>Order confirmed</h2>
            <p id="confirmationText"></p>
            <div class="confirmation-links">
                <a class="demo-button" href="../orders/orders.html" id="ordersLink" data-testid="view-orders">View my orders</a>
                <a class="secondary-link" href="../index_login/home_page.html">Continue shopping</a>
            </div>
        </div>

        <!-- 3) Shown when there is nothing to pay (page opened directly, or already paid) -->
        <div class="empty-cart" id="noPayment" style="display: none;" data-testid="no-payment">
            <p>You have no order waiting for payment.</p>
            <a href="../index_login/home_page.html">Browse products</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/cart-service.js"></script>
    <script src="../js/nav.js"></script>
    <script src="payment.js"></script>
</body>
</html>
